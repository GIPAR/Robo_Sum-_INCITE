behaviors:
  SumoBrain: # Mude isso se o Behavior Name no Unity for diferente
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true # Muito importante para cálculos de física e posição
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 2000000 # 2 milhões de passos é um bom começo para ver resultados
    time_horizon: 64
    summary_freq: 10000