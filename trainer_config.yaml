behaviors:
  SumoBrain: 
    trainer_type: ppo
    hyperparameters:
      batch_size: 20480
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 512     
      num_layers: 3         
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:            
        strength: 0.01
        gamma: 0.99
        encoding_size: 512
        learning_rate: 3.0e-4

    self_play:
      save_steps: 20000 
      team_change: 100000  
      swap_steps: 10000
      window: 15
      play_against_latest_model_ratio: 0.3
      initial_elo: 1200.0

    max_steps: 5000000
    time_horizon: 512
    summary_freq: 20000