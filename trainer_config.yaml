behaviors:
  SumoBrain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 81920 
      learning_rate: 1.5e-4        
      beta: 1.5e-2                 
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant

    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.93                
        strength: 1.0

    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 25000          
      window: 15                   
      play_against_latest_model_ratio: 0.75
      initial_elo: 0.0

    max_steps: 10000000
    time_horizon: 512
    summary_freq: 20000